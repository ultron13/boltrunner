services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: boltrunner
      POSTGRES_PASSWORD: boltrunner
      POSTGRES_DB: boltrunner
    ports:
      - "5432:5432"
    volumes:
      - boltrunner-postgres-data:/var/lib/postgresql/data

volumes:
  boltrunner-postgres-data:
